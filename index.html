<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unique Music Player</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(120deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
}

.player {
    width: 380px;
    padding: 28px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(14px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    color: #fff;
    text-align: center;
}

.title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 18px;
}

.circle {
    width: 80px;
    height: 80px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
}

.buttons button {
    border: none;
    padding: 12px 22px;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
}

.buttons button:active {
    transform: scale(0.95);
}

.progress,
.volume {
    width: 100%;
    margin: 12px 0;
    accent-color: #ff9a9e;
}

.time {
    font-size: 14px;
    opacity: 0.9;
}

.label {
    margin-top: 8px;
    font-size: 14px;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="player">
    <div class="circle"></div>
    <div class="title">Floating Beats</div>

    <div class="buttons">
        <button onclick="audio.play()">Play</button>
        <button onclick="audio.pause()">Pause</button>
    </div>

    <input type="range" class="progress" id="progress" value="0">

    <div class="time" id="time">0:00 / 0:00</div>

    <div class="label">Volume</div>
    <input type="range" class="volume" min="0" max="1" step="0.01" value="0.6" id="volume">

    <audio id="audio">
        <source src="tamil_bgm.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const time = document.getElementById("time");

audio.addEventListener("timeupdate", () => {
    progress.value = (audio.currentTime / audio.duration) * 100 || 0;

    const cMin = Math.floor(audio.currentTime / 60);
    const cSec = Math.floor(audio.currentTime % 60);
    const tMin = Math.floor(audio.duration / 60) || 0;
    const tSec = Math.floor(audio.duration % 60) || 0;

    time.textContent =
        `${cMin}:${cSec.toString().padStart(2, '0')} / ${tMin}:${tSec.toString().padStart(2, '0')}`;
});

progress.addEventListener("input", () => {
    audio.currentTime = (progress.value / 100) * audio.duration;
});

volume.addEventListener("input", () => {
    audio.volume = volume.value;
});
</script>

</body>
</html>
